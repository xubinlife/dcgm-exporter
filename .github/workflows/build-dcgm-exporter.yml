name: Build and Push dcgm-exporter Image

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Git branch or tag to build, e.g. master, custom-fix, 4.5.2-4.8.1"
        required: true
        default: "master"
        type: string
      image_tag:
        description: "Docker image tag to push, e.g. 4.5.2-4.8.1-custom. Default = source_ref-safe"
        required: false
        default: ""
        type: string
      image_name:
        description: "Docker Hub image name"
        required: true
        default: "dcgm-exporter"
        type: string
      push_latest:
        description: "Also push :latest"
        required: true
        default: false
        type: boolean

permissions:
  contents: read

env:
  REGISTRY: docker.io
  IMAGE_NAMESPACE: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout selected source ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref }}
          fetch-depth: 0
          fetch-tags: true

      - name: Show source info
        run: |
          echo "source_ref=${{ inputs.source_ref }}"
          git rev-parse HEAD
          git describe --tags --always || true

      - name: Set image tag
        id: vars
        shell: bash
        run: |
          if [ -n "${{ inputs.image_tag }}" ]; then
            TAG="${{ inputs.image_tag }}"
          else
            TAG="$(echo '${{ inputs.source_ref }}' | tr '/:@ ' '-' )"
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Using image tag: $TAG"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build distroless image into local docker
        run: |
          make distroless PLATFORMS=linux/amd64 OUTPUT=type=docker

      - name: Show local images
        run: docker images

      - name: Find built source image
        id: image
        shell: bash
        run: |
          set -euo pipefail

          SRC="$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -E '(dcgm-exporter|nvidia/.*/dcgm-exporter|.*/dcgm-exporter):' | head -n1 || true)"

          if [ -z "$SRC" ]; then
            echo "Cannot find built dcgm-exporter image in local docker images"
            docker images
            exit 1
          fi

          echo "src=$SRC" >> "$GITHUB_OUTPUT"
          echo "Found source image: $SRC"

      - name: Retag and push
        env:
          SRC_IMAGE: ${{ steps.image.outputs.src }}
          DST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image_name }}:${{ steps.vars.outputs.tag }}
        run: |
          set -euo pipefail
          echo "Tagging $SRC_IMAGE -> $DST_IMAGE"
          docker tag "$SRC_IMAGE" "$DST_IMAGE"
          docker push "$DST_IMAGE"

      - name: Push latest tag
        if: ${{ inputs.push_latest }}
        env:
          SRC_IMAGE: ${{ steps.image.outputs.src }}
          LATEST_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAMESPACE }}/${{ inputs.image_name }}:latest
        run: |
          set -euo pipefail
          docker tag "$SRC_IMAGE" "$LATEST_IMAGE"
          docker push "$LATEST_IMAGE"

      - name: Print pushed image
        run: |
          echo "Pushed image:"
          echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:${{ steps.vars.outputs.tag }}"
          if [ "${{ inputs.push_latest }}" = "true" ]; then
            echo "docker.io/${{ secrets.DOCKERHUB_USERNAME }}/${{ inputs.image_name }}:latest"
          fi
